<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc">
  <title id="title">NavBot 接入 Gazebo PPO 前后的控制程序</title>
  <desc id="desc">接入前，LiDAR 与深度相机进入地图，由 A 星规划和手写控制器直接产生线速度与角速度。接入后，LiDAR 转换为七十八维观测，Gazebo 训练的 PPO 提议速度；原有的深度加 LiDAR 地图及 A 星路线负责检查和必要时接管。深度并未进入 PPO 输入。</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="#526660"/></marker>
    <style>
      .label{font:700 24px "Noto Sans SC","Microsoft YaHei",sans-serif;fill:#10211d}
      .text{font:600 18px "Noto Sans SC","Microsoft YaHei",sans-serif;fill:#10211d}
      .small{font:15px "Noto Sans SC","Microsoft YaHei",sans-serif;fill:#53645f}
      .mono{font:600 15px "DM Mono",monospace;fill:#53645f}
      .box{fill:#fff;stroke:#a5b8ae;stroke-width:2}
      .ppo{fill:#e5f1db;stroke:#64895f;stroke-width:2}
      .guard{fill:#e6f1ee;stroke:#35836f;stroke-width:2}
      .path{fill:none;stroke:#526660;stroke-width:2.5;marker-end:url(#arrow)}
      .dash{fill:none;stroke:#9aa9a3;stroke-width:2;stroke-dasharray:7 7}
    </style>
  </defs>
  <rect width="1200" height="800" fill="#f6f6f0"/>
  <text x="40" y="49" class="label">哪一个模块变了？</text>
  <text x="40" y="88" class="mono">BEFORE · ISAAC RULE CONTROLLER</text>
  <rect x="40" y="105" width="225" height="120" rx="14" class="box"/>
  <text x="62" y="151" class="text">LiDAR + 深度相机</text><text x="62" y="183" class="small">同一走廊中的障碍观测</text>
  <path d="M265 165H305" class="path"/>
  <rect x="310" y="105" width="235" height="120" rx="14" class="box"/>
  <text x="332" y="151" class="text">地面过滤 + 障碍网格</text><text x="332" y="183" class="small">2.5 cm 地图 / 14 cm 净空</text>
  <path d="M545 165H585" class="path"/>
  <rect x="590" y="105" width="255" height="120" rx="14" class="box"/>
  <text x="612" y="151" class="text">A* + 手写控制规则</text><text x="612" y="183" class="small">直接计算 v 与 w</text>
  <path d="M845 165H885" class="path"/>
  <rect x="890" y="105" width="270" height="120" rx="14" class="box"/>
  <text x="912" y="151" class="text">限速 → 差速车轮</text><text x="912" y="183" class="small">执行 v、w / 接触监测</text>

  <line x1="40" y1="265" x2="1160" y2="265" stroke="#cad6cc" stroke-width="2"/>
  <text x="40" y="313" class="mono">AFTER · GAZEBO-TRAINED PPO IN ISAAC SIM</text>
  <text x="40" y="348" class="small">上路：PPO 提议动作</text>
  <rect x="40" y="365" width="188" height="113" rx="14" class="box"/>
  <text x="60" y="410" class="text">Isaac LiDAR</text><text x="60" y="442" class="small">扫描返回</text>
  <path d="M228 421H263" class="path"/>
  <rect x="268" y="365" width="208" height="113" rx="14" class="box"/>
  <text x="288" y="410" class="text">78 维观测适配</text><text x="288" y="442" class="small">距离 / 变化 / 动作 / 目标</text>
  <path d="M476 421H511" class="path"/>
  <rect x="516" y="365" width="202" height="113" rx="14" class="ppo"/>
  <text x="536" y="410" class="text">Gazebo PPO</text><text x="536" y="442" class="small">已训练权重 · 仅推理</text>
  <path d="M718 421H753" class="path"/>
  <rect x="758" y="365" width="163" height="113" rx="14" class="ppo"/>
  <text x="778" y="410" class="text">提议 v、w</text><text x="778" y="442" class="small">新的动作来源</text>
  <path d="M921 421H971" class="path"/>
  <rect x="976" y="405" width="184" height="146" rx="14" class="guard"/>
  <text x="996" y="451" class="text">安全选择</text><text x="996" y="481" class="small">通过：执行 PPO</text><text x="996" y="509" class="small">否则：A* 接管</text>

  <text x="40" y="523" class="small">下路：原 Isaac 地图与路线保留</text>
  <rect x="40" y="540" width="188" height="113" rx="14" class="box"/>
  <text x="60" y="586" class="text">LiDAR + 深度</text><text x="60" y="618" class="small">深度看低矮物体</text>
  <path d="M228 596H263" class="path"/>
  <rect x="268" y="540" width="208" height="113" rx="14" class="box"/>
  <text x="288" y="586" class="text">障碍网格</text><text x="288" y="618" class="small">地面过滤 / 14 cm 净空</text>
  <path d="M476 596H511" class="path"/>
  <rect x="516" y="540" width="202" height="113" rx="14" class="box"/>
  <text x="536" y="586" class="text">A* 路线</text><text x="536" y="618" class="small">保留原来的控制动作</text>
  <path d="M718 596H753" class="path"/>
  <rect x="758" y="540" width="163" height="113" rx="14" class="guard"/>
  <text x="778" y="586" class="text">地图审核</text><text x="778" y="618" class="small">净空 + 路线方向</text>
  <path d="M921 596H1068V551" class="path"/>
  <path d="M1068 551V573" class="path"/>
  <rect x="976" y="578" width="184" height="75" rx="14" class="box"/>
  <text x="996" y="611" class="text">限速 → 差速车轮</text><text x="996" y="637" class="small">与上一版相同的执行接口</text>

  <rect x="40" y="699" width="1120" height="64" rx="12" fill="#fff6e3" stroke="#e3c685"/>
  <text x="61" y="727" class="text">尚未启用：深度 → 虚拟 LiDAR 扫描 → PPO 观测</text>
  <text x="61" y="751" class="small">目前深度只参与下路的地图和接管判断；书本的深度融合仅做过静态感知试验。</text>
</svg>
