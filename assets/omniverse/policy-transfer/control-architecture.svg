<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1300 850" role="img" aria-labelledby="title desc">
  <title id="title">NavBot 接入 Gazebo PPO 前后的动作来源</title>
  <desc id="desc">以前，LiDAR 和深度相机建图，A 星与手写规则直接输出速度给车轮。现在两条路径同时计算：上路由 LiDAR 观测和 Gazebo 训练的 PPO 提议线速度及角速度；下路由 LiDAR 和深度相机建图，A 星产生备用速度与安全判断依据。两路箭头都进入安全选择框。通过净空和方向检查则选择 PPO，否则选择 A 星；选定后才限速并发送给车轮。深度尚未直接输入 PPO。</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="#526660"/></marker>
    <style>
      .title{font:700 26px "Noto Sans SC","Microsoft YaHei",sans-serif;fill:#10211d}
      .text{font:600 19px "Noto Sans SC","Microsoft YaHei",sans-serif;fill:#10211d}
      .small{font:16px "Noto Sans SC","Microsoft YaHei",sans-serif;fill:#53645f}
      .mono{font:600 15px "DM Mono",monospace;fill:#53645f}
      .box{fill:#fff;stroke:#a5b8ae;stroke-width:2}
      .ppo{fill:#e5f1db;stroke:#64895f;stroke-width:2}
      .guard{fill:#e6f1ee;stroke:#35836f;stroke-width:2}
      .path{fill:none;stroke:#526660;stroke-width:2.6;marker-end:url(#arrow)}
    </style>
  </defs>
  <rect width="1300" height="850" fill="#f6f6f0"/>
  <text x="40" y="51" class="title">哪一个模块变了？</text>
  <text x="40" y="91" class="mono">BEFORE · HAND-WRITTEN ISAAC CONTROLLER</text>

  <rect x="40" y="108" width="230" height="115" rx="14" class="box"/>
  <text x="62" y="155" class="text">LiDAR + 深度相机</text><text x="62" y="186" class="small">障碍观测</text>
  <path d="M270 166H313" class="path"/>
  <rect x="320" y="108" width="240" height="115" rx="14" class="box"/>
  <text x="342" y="155" class="text">地面过滤 + 障碍网格</text><text x="342" y="186" class="small">2.5 cm 地图 / 14 cm 净空</text>
  <path d="M560 166H603" class="path"/>
  <rect x="610" y="108" width="265" height="115" rx="14" class="box"/>
  <text x="632" y="155" class="text">A* + 手写控制规则</text><text x="632" y="186" class="small">直接输出 v、w</text>
  <path d="M875 166H918" class="path"/>
  <rect x="925" y="108" width="325" height="115" rx="14" class="box"/>
  <text x="947" y="155" class="text">限速 → 差速车轮</text><text x="947" y="186" class="small">执行速度 / 监测接触</text>

  <line x1="40" y1="265" x2="1250" y2="265" stroke="#cbd7cd" stroke-width="2"/>
  <text x="40" y="305" class="mono">AFTER · GAZEBO-TRAINED PPO IN ISAAC SIM</text>
  <text x="40" y="333" class="small">两条路径每次都同时计算；上路提议，下路备选，右侧只执行其中一组动作</text>

  <rect x="40" y="350" width="185" height="105" rx="14" class="box"/>
  <text x="60" y="392" class="text">Isaac LiDAR</text><text x="60" y="424" class="small">扫描返回</text>
  <path d="M225 402H253" class="path"/>
  <rect x="260" y="350" width="210" height="105" rx="14" class="box"/>
  <text x="280" y="392" class="text">78 维观测</text><text x="280" y="424" class="small">距离 / 变化 / 动作 / 目标</text>
  <path d="M470 402H498" class="path"/>
  <rect x="505" y="350" width="195" height="105" rx="14" class="ppo"/>
  <text x="525" y="392" class="text">Gazebo PPO</text><text x="525" y="424" class="small">已训练权重 · 仅推理</text>
  <path d="M700 402H728" class="path"/>
  <rect x="735" y="350" width="195" height="105" rx="14" class="ppo"/>
  <text x="755" y="392" class="text">PPO 提议 v、w</text><text x="755" y="424" class="small">还没有送到车轮</text>
  <path d="M930 402H968" class="path"/>

  <rect x="40" y="520" width="185" height="105" rx="14" class="box"/>
  <text x="60" y="562" class="text">LiDAR + 深度</text><text x="60" y="594" class="small">补看低矮障碍</text>
  <path d="M225 572H253" class="path"/>
  <rect x="260" y="520" width="210" height="105" rx="14" class="box"/>
  <text x="280" y="562" class="text">障碍网格</text><text x="280" y="594" class="small">地面过滤 / 14 cm 净空</text>
  <path d="M470 572H498" class="path"/>
  <rect x="505" y="520" width="195" height="105" rx="14" class="box"/>
  <text x="525" y="562" class="text">A* 路线</text><text x="525" y="594" class="small">仍然同时规划</text>
  <path d="M700 572H728" class="path"/>
  <rect x="735" y="520" width="195" height="105" rx="14" class="guard"/>
  <text x="755" y="562" class="text">A* 备用 v、w</text><text x="755" y="594" class="small">也提供地图检查依据</text>
  <path d="M930 572H968" class="path"/>

  <rect x="975" y="350" width="275" height="275" rx="16" class="guard"/>
  <text x="998" y="390" class="text">安全选择 · 每次更新</text>
  <text x="998" y="427" class="small">检查 PPO 提议的动作：</text>
  <text x="998" y="457" class="small">① 预测净空 ≥ 14 cm</text>
  <text x="998" y="487" class="small">② 与 A* 转向差 &lt; 25°</text>
  <line x1="998" y1="509" x2="1226" y2="509" stroke="#9cbdb1"/>
  <text x="998" y="544" class="small">两项都通过 → PPO v、w</text>
  <text x="998" y="574" class="small">任一未通过 → A* v、w</text>
  <text x="998" y="604" class="small">地图无路 / 深度过期 → 停车</text>
  <path d="M1112 625V654" class="path"/>
  <rect x="975" y="660" width="275" height="77" rx="14" class="box"/>
  <text x="998" y="692" class="text">限速 → 差速车轮</text><text x="998" y="719" class="small">唯一执行出口</text>

  <rect x="40" y="769" width="1210" height="60" rx="12" fill="#fff6e3" stroke="#e3c685"/>
  <text x="61" y="793" class="text">尚未启用：深度 → 虚拟 LiDAR 扫描 → PPO 观测</text>
  <text x="61" y="818" class="small">目前深度只进入下路地图；书本的深度融合仅做过静态感知试验。</text>
</svg>
